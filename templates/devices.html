<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devices | RootRaven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    .devices-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .devices-header-title {
      font-size: 13px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .devices-count-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: #fff;
    }
    .btn-add-primary {
      background: #fff !important;
      color: #000 !important;
      font-weight: 700 !important;
      padding: 10px 22px !important;
      border: none !important;
      border-radius: 10px !important;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
    }
    .btn-add-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
      background: #f0f0f0 !important;
    }
    .platform-pill-btn * {
      pointer-events: none;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.08);
      border-radius: 14px;
    }
    .empty-state p { margin: 0 0 16px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">R</div>
        <h2>RootRaven</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-item">
          <span class="nav-icon">/</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="/devices" class="nav-item active">
          <span class="nav-icon">></span>
          <span class="nav-label">Devices</span>
        </a>
        <a href="/apps" class="nav-item">
          <span class="nav-icon">#</span>
          <span class="nav-label">App Listing</span>
        </a>
        <a href="/vault" class="nav-item">
          <span class="nav-icon">*</span>
          <span class="nav-label">Evidence Vault</span>
        </a>
        <a href="/masvs" class="nav-item">
          <span class="nav-icon">%</span>
          <span class="nav-label">MASVS Checklist</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div style="margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.05); font-size:14px; color:#aaa; letter-spacing:0.5px;">
          Developed by<br>
          <span style="display:block; margin-top:8px; font-size:20px; font-weight:700; color:#fff; text-shadow: 0 0 12px rgba(255,255,255,0.8); font-family:'JetBrains Mono', monospace;">Kkaxh1</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1>Device Registry</h1>
      </header>

      <div class="content">
        <div class="devices-header-row">
          <div class="devices-header-title">
            <span>Registered Fleet</span>
            <span id="deviceCountPill" class="devices-count-pill">0</span>
          </div>
          <button class="btn-add-primary" id="openAddModalBtn">
            <span style="font-size:16px;">+</span>
            <span>Add Target</span>
          </button>
        </div>

        <div id="fleetCards" class="fleet-grid"></div>
      </div>
    </main>
  </div>

  <!-- Add Target Modal -->
  <div id="deviceModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Register Target Device</h3>
        <button type="button" class="modal-close" id="closeModalBtn" title="Close">&#x2715;</button>
      </div>

      <form id="deviceForm" class="modal-form">
            <button type="button" class="platform-pill-btn active android" id="platformBtnAndroid" data-type="android">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.551 0 .9993.4482.9993.9993.0001.5511-.4483.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.997-3.459c.125-.2164.051-.4972-.165-.6222-.216-.125-.497-.051-.622.165l-2.023 3.504C15.421 8.358 13.766 8 12 8s-3.421.358-5.068.909L4.909 5.405c-.125-.216-.406-.29-.622-.165-.216.125-.29.4058-.165.6222l1.997 3.459C2.688 11.171 0 14.887 0 19.25h24c0-4.363-2.688-8.079-6.1185-9.9286"/></svg>
              <span>Android Platform</span>
            </button>
            <button type="button" class="platform-pill-btn ios" id="platformBtnIos" data-type="ios">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.06 1.71-.93 2.73 1.01.08 2.02-.48 2.64-1.23"/></svg>
              <span>Apple iOS</span>
            </button>
          </div>
        </div>

        <!-- Identification -->
        <div class="modal-row">
          <div class="field-group">
            <label for="deviceName">Device Identifier / Model</label>
            <input id="deviceName" required placeholder="e.g. POCO X3 / Pixel 7">
          </div>
          <div class="field-group">
            <label for="deviceIp" id="deviceIpLabel">Network IP / USB Serial</label>
            <input id="deviceIp" required placeholder="e.g. 192.168.1.101 or 131b62b1">
          </div>
        </div>

        <div class="field-group">
          <label for="deviceDescription">Device Note / Description</label>
          <input id="deviceDescription" placeholder="Optional lab notes (e.g. Rooted Magisk v26, Android 13)">
        </div>

        <!-- SSH Credentials Section -->
        <div class="modal-section-title">SSH Remote Shell Credentials (Optional)</div>
        <div class="modal-row">
          <div class="field-group">
            <label for="deviceSshId">SSH Username</label>
            <input id="deviceSshId" placeholder="e.g. root / u0_a215">
          </div>
          <div class="field-group">
            <label for="deviceSshPass">SSH Password</label>
            <input id="deviceSshPass" type="password" placeholder="e.g. alpine / password">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="modalSubmitBtn">Save Device</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Device Health Deep Telemetry Modal -->
  <div id="deviceHealthModal" class="modal-backdrop">
    <div class="modal" style="max-width: 600px;">
      <div class="modal-header">
        <h3 id="healthModalTitle">Device Health & Telemetry</h3>
        <button type="button" class="modal-close" id="closeHealthModalBtn" title="Close">&#x2715;</button>
      </div>

      <div id="healthModalContent" style="margin-top:16px; display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <div id="toast"></div>
  <pre id="debugConsole" class="mono" style="display:none;"></pre>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
